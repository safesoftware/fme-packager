[tox]
min_version = 4.55.1
env_list = py{310,311,312,313,314}

[testenv]
passenv =
    FME_HOME
dependency_groups =
    dev
commands =
    pytest --cov={envsitepackagesdir}/fme_packager --cov-append -m ""

[testenv:format]
commands =
    ruff format --check

[testenv:check]
commands =
    ruff check
