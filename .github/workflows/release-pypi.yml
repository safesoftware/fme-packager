name: Build and release wheel to PyPI
on:
  release:
    types: [created]
jobs:
  deploy:
    runs-on: ubuntu-slim
    if: github.server_url == 'https://github.com'
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install
      run: pip install --group dev -e .
    - name: Run tests
      run: pytest
    - name: Build
      run: python -m build
    - name: Release to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
