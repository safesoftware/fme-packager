fpkg_version: 1
uid: my-package
publisher_uid: safe
name: My FME Package
description: A short description of my FME Package.
version: 0.1.0
minimum_fme_build: 25000
author:
  name: G Raymond
  email: me@example.com
package_content:
  application_plugins:
    - name: agent-plugin
      entries:
        - platforms: [windows-x86-cp14]
          file: agent-plugin.windows-x86-cp14.0.2.3.pyz
          type: pyz
          env: { PEX_ROOT: "%writabledir%/.pycache" }
          command: ["%pythoninterpreter%", "%plugindir%/agent-plugin.windows-x86-cp14.0.2.3.pyz", "serve"]
        - platforms: [macos-aarch64]
          file: agent-plugin.macos-aarch64.0.2.3.pyz
          type: pyz
          env: { PEX_ROOT: "%writabledir%/.pycache" }
          command: ["%pythoninterpreter%", "%plugindir%/agent-plugin.macos-aarch64.0.2.3.pyz", "serve"]
