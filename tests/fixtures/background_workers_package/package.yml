fpkg_version: 1
uid: my-package
publisher_uid: safe
name: My FME Package
description: A short description of my FME Package.
version: 0.1.0
minimum_fme_build: 25000
author:
  name: G Raymond
  email: me@example.com
package_content:
  background_workers:
    - name: agent-plugin
      entry_points:
        - platforms: [windows-x86-cp14]
          filename: agent-plugin.windows-x86-cp14.0.2.3.pyz
          entry_point: PEX_ROOT=%writabledir%/.pycache %pythoninterpreter% %bgworkersdir%/agent-plugin.windows-x86-cp14.0.2.3.pyz %debug% serve %args%
        - platforms: [macos-aarch64]
          filename: agent-plugin.macos-aarch64.0.2.3.pyz
          entry_point: PEX_ROOT=%writabledir%/.pycache %pythoninterpreter% %bgworkersdir%/agent-plugin.macos-aarch64.0.2.3.pyz %debug% serve %args%
