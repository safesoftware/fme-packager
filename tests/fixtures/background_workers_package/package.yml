fpkg_version: 1
uid: my-package
publisher_uid: example
name: My FME Package
description: A short description of my FME Package.
version: 0.1.0
minimum_fme_build: 25000
author:
  name: G Raymond
  email: me@example.com
package_content:
  background_workers:
    - name: agent-plugin
      entry_points:
        - platform: windows-x64
          target: PEX_ROOT=%writabledir%/.pycache %pythoninterpreter% %bgworkersdir%/agent-plugin.windows-x64.0.2.3.pyz %debug% serve %args%
        - platform: macos
          target: PEX_ROOT=%writabledir%/.pycache %pythoninterpreter% %bgworkersdir%/agent-plugin.macos.0.2.3.pyz %debug% serve %args%
